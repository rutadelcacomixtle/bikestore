<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fondo círculo azul -->
  <circle cx="256" cy="256" r="252" fill="#1d4ed8"/>
  <circle cx="256" cy="256" r="252" fill="none" stroke="#ffffff" stroke-width="6"/>

  <!-- Borde cadena de bicicleta (simulado con rectángulos pequeños en círculo) -->
  <g fill="none" stroke="#ffffff" stroke-width="3">
    <circle cx="256" cy="256" r="232" stroke-dasharray="12 6" stroke-linecap="round"/>
  </g>

  <!-- Engranaje/Corona central -->
  <g transform="translate(256,256)" fill="#ffffff">
    <!-- Biela horizontal -->
    <rect x="-70" y="-8" width="140" height="16" rx="8" fill="#ffffff"/>
    <!-- Biela diagonal izquierda -->
    <rect x="-8" y="-8" width="80" height="16" rx="8" transform="rotate(-120)" fill="#ffffff"/>
    <!-- Biela diagonal derecha -->
    <rect x="-8" y="-8" width="80" height="16" rx="8" transform="rotate(120)" fill="#ffffff"/>
    <!-- Círculo central -->
    <circle cx="0" cy="0" r="22" fill="#1d4ed8" stroke="#ffffff" stroke-width="5"/>
    <circle cx="0" cy="0" r="8" fill="#ffffff"/>
    <!-- Pedal izquierdo -->
    <rect x="-80" y="-12" width="24" height="10" rx="3" fill="#ffffff"/>
    <!-- Pedal derecho -->
    <rect x="56" y="2" width="24" height="10" rx="3" fill="#ffffff"/>
    <!-- Tornillos en las puntas de biela -->
    <circle cx="-62" cy="0" r="7" fill="#1d4ed8" stroke="#ffffff" stroke-width="3"/>
    <circle cx="62" cy="0" r="7" fill="#1d4ed8" stroke="#ffffff" stroke-width="3"/>
    <circle cx="31" cy="-54" r="7" fill="#1d4ed8" stroke="#ffffff" stroke-width="3"/>
    <circle cx="-31" cy="54" r="7" fill="#1d4ed8" stroke="#ffffff" stroke-width="3"/>
    <circle cx="31" cy="54" r="7" fill="#1d4ed8" stroke="#ffffff" stroke-width="3"/>
    <circle cx="-31" cy="-54" r="7" fill="#1d4ed8" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Llave inglesa izquierda -->
  <g transform="translate(130,256) rotate(-30)" fill="#ffffff" opacity="0.85">
    <rect x="-6" y="-40" width="12" height="60" rx="4"/>
    <ellipse cx="0" cy="-44" rx="14" ry="10"/>
    <ellipse cx="0" cy="-44" rx="7" ry="5" fill="#1d4ed8"/>
  </g>

  <!-- Llave inglesa derecha -->
  <g transform="translate(382,256) rotate(30)" fill="#ffffff" opacity="0.85">
    <rect x="-6" y="-40" width="12" height="60" rx="4"/>
    <ellipse cx="0" cy="-44" rx="14" ry="10"/>
    <ellipse cx="0" cy="-44" rx="7" ry="5" fill="#1d4ed8"/>
  </g>

  <!-- Texto CHARLES (arco superior) -->
  <defs>
    <path id="arcTop" d="M 256,256 m -185,0 a 185,185 0 1,1 370,0" fill="none"/>
    <path id="arcBottom" d="M 80,290 a 185,185 0 0,0 352,0" fill="none"/>
  </defs>

  <!-- CHARLES centrado arriba -->
  <text font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="68" fill="#ffffff" text-anchor="middle" x="256" y="185" letter-spacing="4">CHARLES</text>

  <!-- BIKES centrado abajo del centro -->
  <text font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="72" fill="#ffffff" text-anchor="middle" x="256" y="365" letter-spacing="6">BIKES</text>

  <!-- TECAMACHALCO en arco inferior -->
  <path id="bottomArc" d="M 90,360 A 185,185 0 0,0 422,360" fill="none"/>
  <text font-family="Arial, sans-serif" font-weight="700" font-size="26" fill="#ffffff" letter-spacing="3" opacity="0.9">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">TECAMACHALCO</textPath>
  </text>

  <!-- Puntos decorativos separadores -->
  <circle cx="256" cy="406" r="5" fill="#ffffff" opacity="0.7"/>
  <circle cx="210" cy="400" r="4" fill="#ffffff" opacity="0.5"/>
  <circle cx="302" cy="400" r="4" fill="#ffffff" opacity="0.5"/>
</svg>
